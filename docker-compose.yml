name: instagramfsv

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: instagram-fsv:local
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -Djava.awt.headless=true}
      BOT_NAME: ${BOT_NAME:-FSVTreuenInstagramHelper2Bot}
      BOT_TOKEN: ${BOT_TOKEN:-8904828996:AAHSYj8gjPj-MHDTTv6pHPp-ZZjA472gT2Y}
      GOOGLE_CREDENTIALS_FILE: /app/config/googleCred.json
      INSTAGRAM_FONTS_DIR: /app/fonts
    volumes:
      - app-data:/app/src/main/resources
      - ./config:/app/config:ro
      - ./fonts:/app/fonts:ro
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  app-data:
    name: instagramfsv_app-data
