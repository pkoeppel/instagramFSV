<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Team anlegen</title>
    <link href="../style.css" rel="stylesheet">
    <script src="../js/helper.js" defer></script>
    <script src="../js/postData.js" defer></script>
    <script src="../js/navigation.js" defer></script>
</head>
<body>
<header class="app-header" data-active="add-team"></header>
<main class="page-shell">
    <div class="page-heading">
        <h1>Neues Team anlegen</h1>
        <p>Vereinsdaten und ein freigestelltes Logo hinzufügen.</p>
    </div>
    <form class="content-card" onsubmit="event.preventDefault(); postNewTeam();">
        <div class="mobile-field">
            <label for="clubName">Vereinsname</label>
            <input id="clubName" name="clubName" type="text" autocomplete="organization" required>
        </div>
        <div class="mobile-field">
            <label for="matchPlace">Spielort</label>
            <input id="matchPlace" name="matchPlace" type="text" autocomplete="address-level2" required>
        </div>
        <div class="mobile-field">
            <label for="clubInsta">Instagram-Profil</label>
            <input id="clubInsta" name="clubInsta" type="text" inputmode="text" placeholder="@verein">
        </div>
        <div class="mobile-field">
            <label for="clubPic">Vereinslogo als PNG</label>
            <input accept="image/png" id="clubPic" name="fileName" type="file" required>
        </div>
        <div class="content-card">
            <h2>Anforderungen an das Logo</h2>
            <ul class="logo-requirements">
                <li>Hintergrund vollständig entfernen</li>
                <li>Logo mittig ausrichten</li>
                <li>Bildgröße 400 × 400 Pixel</li>
                <li>Dateiformat PNG</li>
            </ul>
        </div>
        <button class="primary-action" type="submit">Team speichern</button>
    </form>
</main>
<script>
    window.addEventListener('load', () => {
        document.getElementById('clubName').value = localStorage.getItem('newTeamName') || '';
        localStorage.removeItem('newTeamName');
    });
</script>
</body>
</html>
