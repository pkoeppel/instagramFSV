<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kids Ergebnis</title>
    <link href="../../style.css" rel="stylesheet">
    <script src="../../js/helper.js" defer></script>
    <script src="../../js/getData.js" defer></script>
    <script src="../../js/navigation.js" defer></script>
</head>
<body>
<header class="app-header" data-active="youth-result"></header>
<main class="page-shell">
    <div class="page-heading">
        <h1>Ergebnisse Kids</h1>
        <p>Spiele auswählen, Berichte ergänzen und eine gemeinsame Ausgabe erstellen.</p>
    </div>
    <section class="content-card">
        <h2>Spiele auswählen</h2>
        <ul class="result-list" id="matchesList"></ul>
    </section>
    <section class="content-card">
        <h2>Bericht</h2>
        <div class="mobile-field">
            <label for="headline">Überschrift</label>
            <input id="headline" type="text">
        </div>
        <div id="reportboxes"></div>
        <input class="primary-action" onclick="postYouthResults()" type="button" value="Ergebnisse senden">
    </section>
    <section class="content-card">
        <h2>Status</h2>
        <div id="created"></div>
        <div id="showReport"></div>
    </section>
</main>
<script>
    window.addEventListener('load', getAllYouthMatches);
</script>
</body>
</html>
