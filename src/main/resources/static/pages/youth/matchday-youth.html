<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kids Spieltag</title>
    <script src="../../js/helper.js" defer></script>
    <script src="../../js/postData.js" defer></script>
    <script src="../../js/navigation.js" defer></script>
    <link href="../../style.css" rel="stylesheet">
</head>
<body>
<header class="app-header" data-active="youth-matchday"></header>
<main class="page-shell">
    <div class="page-heading">
        <h1>Spieltag Kids</h1>
        <p>Mannschaft auswählen, Spiele vormerken und anschließend gemeinsam ausgeben.</p>
    </div>
    <section class="content-card">
        <div class="mobile-field">
            <label for="teamsSelect">Kids-Mannschaft</label>
            <select id="teamsSelect" name="youth" onchange="showMatches('youth', this.value)"></select>
        </div>
        <div class="mobile-field">
            <label>Vorgemerkte Spiele</label>
            <ul class="buffered-list" id="bufferedTeams"></ul>
        </div>
        <input class="primary-action" onclick="postYouthMatchday()" type="button" value="Vorgemerkte Spiele ausgeben">
    </section>
    <section id="games" class="games-grid" aria-live="polite"></section>
</main>
<script>
    window.addEventListener('load', async () => {
        const selectedTeam = await getTeamIds('youth');
        if (selectedTeam != null) await showMatches('youth', selectedTeam);
    });
</script>
</body>
</html>
