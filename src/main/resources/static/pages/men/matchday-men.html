<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Herren Spieltag</title>
    <script src="../../js/helper.js" defer></script>
    <script src="../../js/navigation.js" defer></script>
    <link href="../../style.css" rel="stylesheet">
</head>
<body>
<header class="app-header" data-active="men-matchday"></header>
<main class="page-shell">
    <div class="page-heading">
        <h1>Spieltag Herren</h1>
        <p>Mannschaft auswählen und eine Spielvorschau aus den gespeicherten Begegnungen erstellen.</p>
    </div>
    <section class="content-card">
        <div class="mobile-field">
            <label for="teamsSelect">Herren-Mannschaft</label>
            <select id="teamsSelect" name="men"></select>
        </div>
    </section>
    <section id="games" class="games-grid" aria-live="polite"></section>
</main>
<script>
    window.addEventListener('load', async () => {
        const selectedTeam = await getTeamIds('men');
        if (selectedTeam != null) await showMatches('men', selectedTeam);
        document.getElementById('teamsSelect').addEventListener('change', event => showMatches('men', event.target.value));
    });
</script>
</body>
</html>
